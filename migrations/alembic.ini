# Used by the `alembic` CLI during development, e.g.:
#   WATCHTOWER__DATABASE__URL=postgresql+psycopg://... alembic -c migrations/alembic.ini upgrade head
# Operators should prefer `watchtower-db upgrade`, which needs no ini file.
[alembic]
script_location = %(here)s
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
