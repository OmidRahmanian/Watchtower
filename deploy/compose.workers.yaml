# Workers, scheduler and notifier over RabbitMQ, layered on compose.yaml:
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.workers.yaml --env-file deploy/.env up -d
#
# Isolation:
# * PostgreSQL and RabbitMQ sit on the internal "backend" network, which has
#   no route out; only the workers and the notifier join it.
# * Workers and notifier share the egress guard's network namespace. Beat
#   uses only backend. The guard atomically installs IPv4 OUTPUT restrictions
#   and denies IPv6; it alone holds NET_ADMIN. Runtime processes have no caps.
# * No Docker socket, privileged container or host networking is used.
#   Runtime containers use an unprivileged user and read-only root filesystem.
#   Python's guard adds hostname/connection checks to the namespace firewall.
name: watchtower-platform

x-runtime: &runtime
  build:
    context: ..
    dockerfile: deploy/worker.Dockerfile
  image: watchtower-worker:dev
  restart: unless-stopped
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64m"]
  environment: &runtime-env
    WATCHTOWER_PROFILE: production
    WATCHTOWER_PROFILE_DIR: /app/config/profiles
    WATCHTOWER__DATABASE__URL: postgresql+psycopg://watchtower:${WATCHTOWER_DB_PASSWORD:?set WATCHTOWER_DB_PASSWORD}@postgres:5432/watchtower
    WATCHTOWER__RUNTIME__BROKER_URL: amqp://watchtower:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in deploy/.env}@rabbitmq:5672//
    WATCHTOWER__NOTIFICATIONS__DESTINATIONS: ${WATCHTOWER_NOTIFICATION_DESTINATIONS:-[]}
  depends_on:
    postgres: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
    egress-guard: {condition: service_healthy}

services:
  # The only NET_ADMIN container. Scanner/notifier processes share this
  # namespace without capabilities, so external binaries cannot bypass the
  # private/metadata destination restrictions in Python by opening sockets.
  egress-guard:
    build:
      context: ..
      dockerfile: deploy/egress.Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=1m"]
    environment:
      WATCHTOWER_ALLOWED_INFRA: postgres:5432,rabbitmq:5672
    networks: [backend, egress]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
  postgres:
    networks: [backend]

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: watchtower
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in deploy/.env}
    volumes:
      - ../data/rabbitmq:/var/lib/rabbitmq
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *runtime
    command: ["celery", "-A", "watchtower.workers.celery_app", "worker", "--queues", "watchtower",
              "--prefetch-multiplier", "1", "--without-gossip", "--without-mingle"]
    volumes:
      - ../data/evidence:/app/data/evidence
    network_mode: "service:egress-guard"
    stop_grace_period: 90s  # in-flight jobs are requeued on SIGTERM

  notifier:
    <<: *runtime
    command: ["celery", "-A", "watchtower.workers.celery_app", "worker", "--queues", "watchtower.notify",
              "--concurrency", "1", "--prefetch-multiplier", "1", "--without-gossip", "--without-mingle"]
    network_mode: "service:egress-guard"

  beat:
    <<: *runtime
    command: ["celery", "-A", "watchtower.workers.celery_app", "beat", "--schedule", "/tmp/celerybeat-schedule"]
    networks: [backend]

networks:
  backend:
    internal: true
  egress: {}
