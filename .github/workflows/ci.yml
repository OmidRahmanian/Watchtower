name: CI

on:
  push:
    branches: [firstversion, "integration/**", "agent/**", "coord/**"]
  pull_request:
    branches: [integration/exposure-platform, firstversion]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The required check: the whole suite on PostgreSQL 17, with nothing skipped.
    name: tests (Python 3.12, PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # A throwaway service container; the suite creates its own role and database in it.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # A superuser-capable admin URL: tests create a non-superuser role and database per session.
      WATCHTOWER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install
        run: python -m pip install -e '.[dev]' -r requirements.txt
      - name: Test
        run: |
          set -o pipefail
          python -m pytest -ra -p no:cacheprovider 2>&1 | tee pytest.log
      - name: Fail on skipped tests
        run: |
          if grep -E '^SKIPPED|[0-9]+ skipped' pytest.log; then
            echo "::error::Tests were skipped; the required check runs every test."
            exit 1
          fi

  static:
    name: dashboard and lab checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dashboard script parses
        run: node --check frontend/app.js
      - name: Lab scripts parse
        run: sh -n lab/lab.sh && sh -n lab/targets/start-web.sh
      - name: Lab compose file is valid
        run: LAB_POSTGRES_PASSWORD=x LAB_DB_PASSWORD=x docker compose -f lab/compose.yaml --env-file /dev/null config --quiet
